name: Build, Test, Release, and Deploy
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Repository
        run: echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')/student-profile-system-2026" >> $GITHUB_ENV

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Test
        run: |
          npm install
          npm test

      - name: Log In to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.run_number }}

      - name: Checkout Manifests Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.actor }}/student-profile-system-2026-manifests
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          path: manifests

      - name: Update Image Tag and Push
        working-directory: manifests
        run: |
          sed -i "s|image: ${{ env.IMAGE_REPO }}:.*|image: ${{ env.IMAGE_REPO }}:${{ github.run_number }}|" k8s/student-app.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/student-app.yaml
          git commit -m "Deploy build ${{ github.run_number }}"
          git push
