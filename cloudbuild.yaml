steps:
  - name: 'node:20'
    entrypoint: npm
    args: ['install']

  - name: 'node:20'
    entrypoint: npm
    args: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/app-images/student-profile-app:$SHORT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/app-images/student-profile-app:$SHORT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'student-profile-app'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/app-images/student-profile-app:$SHORT_SHA'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:student-app-db'
      - '--set-env-vars=DB_HOST=/cloudsql/$PROJECT_ID:us-central1:student-app-db,DB_USER=appuser,DB_NAME=studentdb'
      - '--set-secrets=DB_PASSWORD=db-password:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/app-images/student-profile-app:$SHORT_SHA'
